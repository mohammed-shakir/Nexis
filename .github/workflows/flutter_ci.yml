name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Flutter actions
      uses: subosito/flutter-action@v1
      with:
        flutter-version: '2.x'

    - name: Install dependencies
      run: flutter pub get
      working-directory: ./nexis

    - name: Run Flutter tests
      run: flutter test
      working-directory: ./nexis